# Copy ONE role's connection into that role's Codex configuration.
# Replace absolute paths; never put a token in this file.
# Install repository dependencies with pnpm install --frozen-lockfile first.
[mcp_servers.pulse_payout_maker]
command = "/absolute/path/to/node"
args = ["/absolute/path/to/Pulse/artifacts/payout-operator/cli.mjs", "bridge", "--profile", "maker"]
startup_timeout_sec = 60
tool_timeout_sec = 60


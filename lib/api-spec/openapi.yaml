openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: agora
    description: Agora token operations
  - name: streams
    description: Live stream management
  - name: users
    description: User profile management
  - name: coins
    description: Coin balance and transactions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /agora/token:
    post:
      operationId: generateAgoraToken
      tags: [agora]
      summary: Generate Agora RTC token
      description: Generates a token for joining a live stream channel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgoraTokenRequest"
      responses:
        "200":
          description: Token generated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgoraTokenResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /streams:
    get:
      operationId: listStreams
      tags: [streams]
      summary: List active live streams
      description: Returns all currently active live streams
      responses:
        "200":
          description: List of active streams
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamListResponse"

    post:
      operationId: createStream
      tags: [streams]
      summary: Start a new live stream
      description: Register a new live stream session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStreamRequest"
      responses:
        "201":
          description: Stream created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /streams/{channelId}:
    get:
      operationId: getStream
      tags: [streams]
      summary: Get stream details
      description: Returns details of a specific live stream
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stream details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamResponse"
        "404":
          description: Stream not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: endStream
      tags: [streams]
      summary: End a live stream
      description: Mark a stream as ended and remove it from active streams
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stream ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          description: Stream not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{uid}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user profile
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: upsertUser
      tags: [users]
      summary: Create or update user profile
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertUserRequest"
      responses:
        "200":
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"

  /users/{uid}/stream-background/upload:
    post:
      operationId: requestStreamBackgroundUpload
      tags: [users]
      summary: Request an upload URL for a stream background image
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Upload URL created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaPackUploadResponse"
        "400":
          description: Invalid user ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{uid}/follow:
    post:
      operationId: followUser
      tags: [users]
      summary: Follow a user
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FollowRequest"
      responses:
        "200":
          description: Now following
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "409":
          description: Already following
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: unfollowUser
      tags: [users]
      summary: Unfollow a user
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FollowRequest"
      responses:
        "200":
          description: Unfollowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          description: Not following
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{uid}/follow-status:
    get:
      operationId: getFollowStatus
      tags: [users]
      summary: Check if a user is following another
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: integer
        - name: followerUid
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Follow status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowStatusResponse"

  /users/{uid}/streams:
    get:
      operationId: getUserStreams
      tags: [users]
      summary: Get stream history for a user
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Stream history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamHistoryResponse"

  /streams/{channelId}/heartbeat:
    post:
      operationId: heartbeatStream
      tags: [streams]
      summary: Broadcaster heartbeat
      description: Called periodically by the broadcaster to keep the stream alive. Streams that miss heartbeats are automatically removed.
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Heartbeat acknowledged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          description: Stream not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /streams/{channelId}/viewers:
    post:
      operationId: updateViewerCount
      tags: [streams]
      summary: Update viewer count
      description: Increment or decrement viewer count for a stream
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViewerUpdateRequest"
      responses:
        "200":
          description: Viewer count updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamResponse"
        "404":
          description: Stream not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /streams/{channelId}/chat:
    get:
      operationId: getStreamChat
      tags: [streams]
      summary: Get chat messages for a stream
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
        - name: since
          in: query
          required: false
          schema:
            type: integer
            description: Unix ms timestamp — only return messages after this time
      responses:
        "200":
          description: Chat messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessagesResponse"
    post:
      operationId: sendChatMessage
      tags: [streams]
      summary: Send a chat message to a stream
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendChatMessageRequest"
      responses:
        "200":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessageResponse"
        "404":
          description: Stream not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /streams/{channelId}/earnings:
    get:
      operationId: getStreamEarnings
      tags: [streams]
      summary: Total coins gifted to the host during a specific stream
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stream earnings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamEarningsResponse"

  /streams/{channelId}/leaderboard:
    get:
      operationId: getStreamLeaderboard
      tags: [streams]
      summary: Top gifters for a stream sorted by coins sent
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Gift leaderboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamLeaderboardResponse"

  /coins/balance:
    get:
      operationId: getCoinBalance
      tags: [coins]
      summary: Get coin balance
      parameters:
        - name: uid
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Current balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoinBalanceResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /coins/spend:
    post:
      operationId: spendCoins
      tags: [coins]
      summary: Spend coins on a gift
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoinSpendRequest"
      responses:
        "200":
          description: Coins spent, new balance returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoinBalanceResponse"
        "402":
          description: Insufficient coins
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Idempotency key was already used for a different gift
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /coins/grant:
    post:
      operationId: grantCoins
      tags: [coins]
      summary: Manually grant coins (dev / testing only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoinGrantRequest"
      responses:
        "200":
          description: Coins granted, new balance returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoinBalanceResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /agora/rtm-token:
    post:
      operationId: generateAgoraRtmToken
      tags: [agora]
      summary: Generate Agora RTM (Signaling) token
      description: Generates a token for connecting to Agora RTM / Signaling for DMs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgoraRtmTokenRequest"
      responses:
        "200":
          description: RTM token generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgoraRtmTokenResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{uid}/following:
    get:
      operationId: getUserFollowing
      tags: [users]
      summary: List users that a user follows
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of followed users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowingListResponse"

  /media-packs/uploads:
    post:
      operationId: requestMediaPackUpload
      tags: [media-packs]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MediaPackUploadRequest" } } } }
      responses:
        "201": { description: Upload URL, content: { application/json: { schema: { $ref: "#/components/schemas/MediaPackUploadResponse" } } } }
  /media-packs:
    get:
      operationId: getMediaPacks
      tags: [media-packs]
      responses: { "200": { description: Packs, content: { application/json: { schema: { $ref: "#/components/schemas/MediaPacksResponse" } } } } }
    post:
      operationId: createMediaPack
      tags: [media-packs]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateMediaPackRequest" } } } }
      responses: { "201": { description: Pack, content: { application/json: { schema: { $ref: "#/components/schemas/MediaPackResponse" } } } } }
  /media-packs/{packId}:
    parameters: [{ name: packId, in: path, required: true, schema: { type: integer } }]
    get:
      operationId: getMediaPack
      tags: [media-packs]
      responses: { "200": { description: Pack, content: { application/json: { schema: { $ref: "#/components/schemas/MediaPackResponse" } } } } }
    delete:
      operationId: deleteMediaPack
      tags: [media-packs]
      responses: { "200": { description: Deleted, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessResponse" } } } } }
  /media-packs/{packId}/send:
    post:
      operationId: sendMediaPack
      tags: [media-packs]
      parameters: [{ name: packId, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SendMediaPackRequest" } } } }
      responses: { "201": { description: Sent, content: { application/json: { schema: { $ref: "#/components/schemas/MediaPackMessageResponse" } } } } }
  /media-packs/{packId}/unlock:
    post:
      operationId: unlockMediaPack
      tags: [media-packs]
      parameters: [{ name: packId, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UnlockMediaPackRequest" } } } }
      responses: { "200": { description: Unlocked, content: { application/json: { schema: { $ref: "#/components/schemas/CoinBalanceResponse" } } } }, "402": { description: Insufficient coins } }
  /dms/{uid}:
    get:
      operationId: getDirectMessages
      tags: [dms]
      parameters: [{ name: uid, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: Direct messages, content: { application/json: { schema: { $ref: "#/components/schemas/DirectMessagesResponse" } } } } }
  /dms/media:
    post:
      operationId: sendMediaDm
      tags: [dms]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SendMediaDmRequest" } } } }
      responses: { "201": { description: Media message sent, content: { application/json: { schema: { $ref: "#/components/schemas/DirectMessageResponse" } } } }, "409": { description: Idempotency conflict } }
  /dms/{messageId}/unlock:
    post:
      operationId: unlockMediaDm
      tags: [dms]
      parameters: [{ name: messageId, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UnlockMediaDmRequest" } } } }
      responses: { "200": { description: Unlocked, content: { application/json: { schema: { $ref: "#/components/schemas/UnlockMediaDmResponse" } } } }, "402": { description: Insufficient coins }, "409": { description: Idempotency conflict } }

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    AgoraTokenRequest:
      type: object
      properties:
        channelName:
          type: string
          description: The name of the channel to join
        uid:
          type: integer
          description: User ID (0 for auto-assign)
        role:
          type: string
          enum: [broadcaster, audience]
          description: User role in the channel
      required:
        - channelName
        - uid
        - role

    AgoraTokenResponse:
      type: object
      properties:
        token:
          type: string
          description: The RTC token
        appId:
          type: string
          description: The Agora App ID
        channelName:
          type: string
        uid:
          type: integer
        expiresAt:
          type: integer
          description: Token expiry timestamp (Unix seconds)
      required:
        - token
        - appId
        - channelName
        - uid
        - expiresAt

    Stream:
      type: object
      properties:
        channelId:
          type: string
        hostUid:
          type: integer
        hostName:
          type: string
        hostAvatarUrl:
          type: string
          nullable: true
        hostBackgroundImageUrl:
          type: string
          nullable: true
        title:
          type: string
        viewerCount:
          type: integer
        startedAt:
          type: string
          format: date-time
        category:
          type: string
      required:
        - channelId
        - hostUid
        - hostName
        - title
        - viewerCount
        - startedAt
        - category

    StreamListResponse:
      type: object
      properties:
        streams:
          type: array
          items:
            $ref: "#/components/schemas/Stream"
      required:
        - streams

    StreamResponse:
      type: object
      properties:
        stream:
          $ref: "#/components/schemas/Stream"
      required:
        - stream

    CreateStreamRequest:
      type: object
      properties:
        channelId:
          type: string
        hostUid:
          type: integer
        hostName:
          type: string
        hostAvatarUrl:
          type: string
          nullable: true
        title:
          type: string
        category:
          type: string
      required:
        - channelId
        - hostUid
        - hostName
        - title
        - category

    ViewerUpdateRequest:
      type: object
      properties:
        action:
          type: string
          enum: [join, leave]
      required:
        - action

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    UserProfile:
      type: object
      properties:
        uid:
          type: integer
        name:
          type: string
        bio:
          type: string
        streamBackgroundImagePath:
          type: string
          nullable: true
        streamBackgroundImageUrl:
          type: string
          nullable: true
        followersCount:
          type: integer
        followingCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - uid
        - name
        - bio
        - followersCount
        - followingCount
        - createdAt
        - updatedAt

    UserResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/UserProfile"
      required:
        - user

    UpsertUserRequest:
      type: object
      properties:
        name:
          type: string
        bio:
          type: string
        streamBackgroundImagePath:
          type: string
          nullable: true
      required:
        - name

    StreamHistoryItem:
      type: object
      properties:
        id:
          type: integer
        channelId:
          type: string
        hostUid:
          type: integer
        hostName:
          type: string
        title:
          type: string
        category:
          type: string
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true
        peakViewers:
          type: integer
      required:
        - id
        - channelId
        - hostUid
        - hostName
        - title
        - category
        - startedAt
        - peakViewers

    FollowRequest:
      type: object
      properties:
        followerUid:
          type: integer
      required:
        - followerUid

    FollowStatusResponse:
      type: object
      properties:
        isFollowing:
          type: boolean
      required:
        - isFollowing

    StreamHistoryResponse:
      type: object
      properties:
        streams:
          type: array
          items:
            $ref: "#/components/schemas/StreamHistoryItem"
      required:
        - streams

    CoinBalanceResponse:
      type: object
      properties:
        balance:
          type: integer
      required:
        - balance

    CoinSpendRequest:
      type: object
      properties:
        uid:
          type: integer
          description: Sender user ID
        recipientUid:
          type: integer
          description: Recipient (streamer) user ID
        amount:
          type: integer
        giftName:
          type: string
          description: Name of the gift item sent
        senderName:
          type: string
          description: Display name of the viewer sending the gift
        channelId:
          type: string
          description: Stream channel where the gift was sent
        description:
          type: string
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 100
          description: Unique key for safely retrying the same gift request
      required:
        - uid
        - amount
        - idempotencyKey

    CoinGrantRequest:
      type: object
      properties:
        uid:
          type: integer
        amount:
          type: integer
        note:
          type: string
      required:
        - uid
        - amount

    StreamEarningsResponse:
      type: object
      properties:
        coins:
          type: integer
          description: Total coins earned by the host during this stream
      required:
        - coins

    ChatMessage:
      type: object
      properties:
        id:
          type: string
        senderName:
          type: string
        text:
          type: string
        color:
          type: string
        ts:
          type: integer
      required:
        - id
        - senderName
        - text
        - color
        - ts

    ChatMessagesResponse:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
      required:
        - messages

    SendChatMessageRequest:
      type: object
      properties:
        senderName:
          type: string
        text:
          type: string
        color:
          type: string
      required:
        - text

    LeaderboardEntry:
      type: object
      properties:
        rank:
          type: integer
        uid:
          type: integer
        name:
          type: string
        coins:
          type: integer
      required:
        - rank
        - uid
        - name
        - coins

    StreamLeaderboardResponse:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/LeaderboardEntry"
      required:
        - entries

    AgoraRtmTokenRequest:
      type: object
      properties:
        uid:
          type: string
          description: User ID string for RTM
      required:
        - uid

    AgoraRtmTokenResponse:
      type: object
      properties:
        token:
          type: string
        appId:
          type: string
        uid:
          type: string
        expiresAt:
          type: integer
      required:
        - token
        - appId
        - uid
        - expiresAt

    FollowingUser:

  /posts/{postId}/gifts:
    parameters:
      - { name: postId, in: path, required: true, schema: { type: integer } }
    post:
      operationId: sendPostGift
      description: Send a catalog gift to the post owner and atomically save its comment notice. Retries with the same request ID cannot charge twice.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [giftId, requestId]
              properties:
                giftId: { type: string, pattern: "^[a-z][a-z0-9_-]{0,79}$" }
                giftRevisionId: { type: string }
                expectedCoinCost: { type: integer, minimum: 1 }
                requestId: { type: string, minLength: 16, maxLength: 80, pattern: "^[a-zA-Z0-9-]{16,80}$" }
      responses:
        "200":
          description: Gift sent, or already sent with this request ID
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CoinBalanceResponse" }
        "400":
          description: Invalid gift or own post
        "401":
          description: Authentication required
        "402":
          description: Insufficient coins
        "404":
          description: Post missing or unavailable to this sender
        "409":
          description: Request ID already used for another gift or post
  /posts/{postId}/comments:
    parameters:
      - { name: postId, in: path, required: true, schema: { type: integer } }
    get:
      operationId: getPostComments
      parameters:
        - { name: before, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Latest comments, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostComments" }
    post:
      operationId: addPostComment
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [text, requestId], properties: { text: { type: string, minLength: 1, maxLength: 1000 }, requestId: { type: string, minLength: 16, maxLength: 80 } } }
      responses:
        "200":
          description: Comment added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }
  /posts/{postId}/comments/{commentId}:
    delete:
      operationId: deletePostComment
      parameters:
        - { name: postId, in: path, required: true, schema: { type: integer } }
        - { name: commentId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Comment deleted by its author or the post owner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }

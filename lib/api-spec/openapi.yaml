  /location/country:
    post:
      operationId: refreshCountryLocation
      summary: Refresh the signed-in account country from its connection IP
      responses:
        '200':
          description: Last detected country for the signed-in account
          content:
            application/json:
              schema:
                type: object
                required: [countryCode, country]
                properties:
                  countryCode:
                    type: string
                    nullable: true
                  country:
                    type: string
                    nullable: true
        '401':
          description: Authentication required
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /agora/token:
    post:
      operationId: generateAgoraToken
      tags: [agora]
      summary: Generate Agora RTC token
      description: Generates a token for joining a live stream channel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgoraTokenRequest"
      responses:
        "200":
          description: Token generated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgoraTokenResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /streams:
    get:
      operationId: listStreams
      tags: [streams]
      summary: List active live streams
      description: Returns all currently active live streams
      responses:
        "200":
          description: List of active streams
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamListResponse"

    post:
      operationId: createStream
      tags: [streams]
      summary: Start a new live stream
      description: Register a new live stream session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStreamRequest"
      responses:
        "201":
          description: Stream created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /streams/{channelId}:
    get:
      operationId: getStream
      tags: [streams]
      summary: Get stream details
      description: Returns details of a specific live stream
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stream details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamResponse"
        "404":
          description: Stream not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: endStream
      tags: [streams]
      summary: End a live stream
      description: Mark a stream as ended and remove it from active streams
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
